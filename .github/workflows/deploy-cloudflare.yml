name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Vite loads the existing .env.production during npm run build.
      # Do not override those values with empty GitHub secrets.
      - name: Build site
        run: npm run build
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.131.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check production website after deployment
        run: |
          echo "Verifying https://ennstal-connect.com/ after deployment"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 --output /dev/null https://ennstal-connect.com/
          echo "Production website responds successfully" >> "$GITHUB_STEP_SUMMARY"
