name: Stability CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests and production build
        run: npm run test:ci
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'data-role-theme' dist/assets/index-*.js
          grep -q 'role-theme-supporter' dist/assets/index-*.css
          grep -q '#ffe537' dist/assets/index-*.css
      - name: Archive verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified dist to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then
            echo "dist is already current"
            exit 0
          fi
          git commit -m "chore: publish verified production dist [skip ci]"
          git fetch origin main
          git rebase origin/main || {
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            npm run build
            git add -f dist
            if git diff --cached --quiet; then
              echo "Another workflow already published the same verified dist"
              exit 0
            fi
            git commit -m "chore: publish verified production dist [skip ci]"
          }
          git push origin HEAD:main
