name: Stability CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests and production build
        run: npm run test:ci
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -d dist/assets
