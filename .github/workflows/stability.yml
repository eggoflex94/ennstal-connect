name: Stability CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression tests and production build
        run: npm run test:ci
      - name: Verify production output
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q 'data-role-theme' dist/assets/index-*.js
          grep -q 'role-theme-supporter' dist/assets/index-*.css
          grep -q '#ffe537' dist/assets/index-*.css
      - name: Archive verified production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
