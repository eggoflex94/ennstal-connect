name: Fix Cloudflare Community Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cloudflare-community.yml"

permissions:
  contents: write

concurrency:
  group: fix-cloudflare-community
  cancel-in-progress: false

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wire native all-region member directory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('src/App.jsx')
          text = app.read_text()
          import_line = 'import NativeMembersDirectory from "./NativeMembersDirectory.jsx";\n'
          if import_line not in text:
              anchor = 'import MemberCardView from "./MemberCardView.jsx";\n'
              if anchor not in text:
                  raise SystemExit('MemberCardView import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          pattern = re.compile(r'\{page === "members" && <section>.*?</section>\}\s*(?=\{page === "friends")', re.S)
          replacement = '''{page === "members" && <NativeMembersDirectory
            members={members}
            regions={regions}
            activeRegion={activeRegion}
            profile={profile}
            friendships={friendships}
            onOpen={openMember}
            onMessage={openChat}
          />}\n        '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1 and '<NativeMembersDirectory' not in text:
              raise SystemExit(f'members page replacement failed: {count}')
          app.write_text(text)

          css = Path('src/community-native-final.css')
          styles = css.read_text()
          marker = '/* Native all-region member directory */'
          if marker not in styles:
              styles += '\n\n' + marker + '\n' + '.native-members-directory{display:grid;gap:18px}.native-members-heading{margin-bottom:0}.native-members-heading>strong{padding:8px 12px;border-radius:999px;background:#fff4ed;color:#e85b20;white-space:nowrap}.native-member-search{display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(220px,.7fr) auto;gap:10px;padding:18px;border-radius:18px}.native-member-search>.search-input,.native-member-search>select{width:100%;min-height:48px;box-sizing:border-box;border:1px solid #cfd9e2;border-radius:13px;padding:0 13px;background:#fff;font:inherit}.native-member-search>label{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border:1px solid #cfd9e2;border-radius:13px;background:#f8fafc;font-weight:800;white-space:nowrap}.native-member-quick-filters{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}.native-member-quick-filters button{min-height:40px;padding:7px 13px;border:1px solid #d6dfe7;border-radius:999px;background:#fff;color:#334155;font-weight:800}.native-member-quick-filters button.active{background:#172238;color:#fff;border-color:#172238}.native-member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.native-member-card{display:grid;gap:12px;padding:16px}.native-member-main{display:flex;align-items:center;gap:12px;width:100%;padding:0;border:0;background:transparent;text-align:left;color:inherit;cursor:pointer}.native-member-avatar-wrap{position:relative;flex:0 0 58px;width:58px;height:58px}.native-member-avatar-wrap img{width:58px;height:58px;border-radius:50%;object-fit:cover}.native-member-avatar-wrap i{position:absolute;right:1px;bottom:2px;width:12px;height:12px;border:2px solid #fff;border-radius:50%;background:#94a3b8}.native-member-avatar-wrap i.online{background:#22c55e}.native-member-copy{display:grid;gap:3px;min-width:0}.native-member-copy strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.native-member-copy small{color:#64748b}.native-member-copy em{color:#475569;font-style:normal;font-size:.9rem}.native-member-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.native-member-actions button{min-height:42px}@media(max-width:900px){.native-member-search{grid-template-columns:1fr}.native-member-quick-filters{grid-column:auto}}@media(max-width:600px){.native-member-grid{grid-template-columns:1fr}.native-members-heading{display:grid}.native-members-heading>strong{justify-self:start}}\n'
              css.write_text(styles)
          PY
      - name: Verify source and production build
        run: npm run test:ci
      - name: Commit verified Cloudflare-ready source and dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/community-native-final.css dist
          if git diff --cached --quiet; then
            echo "Native member directory is already wired and built"
            exit 0
          fi
          git commit -m "Wire native member directory and refresh Cloudflare dist"
          git push origin HEAD:main
