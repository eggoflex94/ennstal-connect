name: Fix Cloudflare Community Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cloudflare-community.yml"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.json"
      - "src/**"
      - "public/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-cloudflare-community
  cancel-in-progress: false

jobs:
  fix-build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify native member directory wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx').read_text()
          if 'import NativeMembersDirectory from "./NativeMembersDirectory.jsx";' not in app:
              raise SystemExit('NativeMembersDirectory import missing')
          if 'page === "members" && <NativeMembersDirectory' not in app:
              raise SystemExit('NativeMembersDirectory route missing')
          PY
      - name: Verify source and production build
        run: npm run test:ci
      - name: Verify critical production features are bundled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = list(Path('dist/assets').glob('*.js'))
          bundle = '\n'.join(path.read_text(errors='ignore') for path in assets)
          required = [
              'Was machst du gerade?',
              'Aktuelle Aktivitäten',
              'Aktuelle Events',
              'Aktivität teilen',
              'Ich bin dabei',
              'Interessiert',
              'ec-fake-portal',
              'Fake-Account-Prüfung',
              'head_admin_fake_account_candidates',
              'data-head-admin-tool',
              'Fake-Erkennung',
              'Admin-Logbuch'
          ]
          missing = [text for text in required if text not in bundle]
          if missing:
              raise SystemExit('Critical production features missing from bundle: ' + ', '.join(missing))
          PY
      - name: Deploy verified build to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Commit verified Cloudflare dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Cloudflare dist is already current"
            exit 0
          fi
          git commit -m "Refresh Cloudflare dist from current app source"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main
