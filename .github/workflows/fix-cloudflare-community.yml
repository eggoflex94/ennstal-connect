name: Fix Cloudflare Community Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cloudflare-community.yml"
      - "src/NativeMembersDirectory.jsx"
      - "src/community-native-final.css"
      - "src/profile-design-preview-role.css"
      - "src/profile-customization.js"
      - "src/main.jsx"
      - "src/sidebar-reward-progress.js"
      - "src/sidebar-reward-progress.css"
      - "src/auth-community-intro.js"
      - "src/standard-theme-variants.css"
      - "src/standard-theme-rich.css"
      - "src/standard-theme-runtime.js"
      - "public/ennstal-connect-wordmark-red.svg"
      - "public/ennstal-connect-wordmark-blue.svg"

permissions:
  contents: write

concurrency:
  group: fix-cloudflare-community
  cancel-in-progress: false

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify native member directory wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('src/App.jsx').read_text()
          if 'import NativeMembersDirectory from "./NativeMembersDirectory.jsx";' not in app:
              raise SystemExit('NativeMembersDirectory import missing')
          if 'page === "members" && <NativeMembersDirectory' not in app:
              raise SystemExit('NativeMembersDirectory route missing')
          PY
      - name: Verify source and production build
        run: npm run test:ci
      - name: Commit verified Cloudflare dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Cloudflare dist is already current"
            exit 0
          fi
          git commit -m "Refresh Cloudflare dist for profile layout cleanup"
          git pull --rebase origin main
          git push origin HEAD:main
