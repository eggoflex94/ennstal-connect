name: Native Community Upgrade

on:
  push:
    branches: [main]
    paths:
      - "scripts/native_community_upgrade.py"
      - "scripts/native_community_upgrade_finish.py"
      - ".github/workflows/native-community-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: native-community-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply native React upgrade
        run: python3 scripts/native_community_upgrade_finish.py
      - name: Install dependencies
        run: npm ci
      - name: Verify tests and production build
        run: npm run test:ci
      - name: Remove one-time upgrade files
        run: rm scripts/native_community_upgrade.py scripts/native_community_upgrade_finish.py .github/workflows/native-community-upgrade.yml
      - name: Commit verified native upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement native member search and homepage design editor"
          git push origin HEAD:main
