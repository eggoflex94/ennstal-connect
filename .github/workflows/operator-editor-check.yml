name: Operator Editor Checks
on:
  push:
    paths:
      - 'src/PageDesignStudio.jsx'
      - 'src/operatorContentStore.js'
      - 'src/operatorPageDesign.js'
      - 'src/dashboard-community-realtime.js'
      - 'src/dashboard-points-wallet.css'
      - 'src/mobile-desktop-parity-2026.css'
      - 'src/member-hover-preview.css'
      - 'src/memberHoverPreview.js'
      - 'src/MemberHoverPreview.jsx'
      - 'src/support-contacts-modern.js'
      - 'src/dashboard-top-polish.js'
      - 'src/memberPresence.js'
      - 'src/mobile-presence-sync.js'
      - 'e2e/core-smoke.spec.mjs'
      - '.github/workflows/operator-editor-check.yml'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install chromium
      - run: npx playwright test --grep 'profile-visitor nickname' --workers=1 --retries=0 --repeat-each=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: operator-editor-diagnostics
          path: |
            test-results
            playwright-report
