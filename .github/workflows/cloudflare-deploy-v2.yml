name: Cloudflare Deploy V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-deploy-v2.yml"
      - "src/**"
      - "public/**"
      - "test/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "wrangler.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm run test:ci
      - name: Verify Immobilien feature exists in production bundle
        run: |
          test -f dist/index.html
          if ! grep -rlq 'Immobilien' dist/assets --include='*.js'; then
            echo "::error::Immobilien navigation missing from compiled JavaScript."
            exit 1
          fi
          echo "Immobilien verified inside production JavaScript bundle."
      - name: Stamp deployment revision
        run: |
          printf '{"commit":"%s","deployed_at":"%s","feature":"immobilien"}\\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/ec-deployment.json
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      - name: Verify latest deployment is live
        run: |
          set -e
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://ennstal-connect.com/ec-deployment.json?verify=$GITHUB_SHA" -o /tmp/ec-deployed.json; then
              cat /tmp/ec-deployed.json
              if grep -Fq "$GITHUB_SHA" /tmp/ec-deployed.json; then
                echo "Cloudflare production serves latest git revision: $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Production domain does not serve freshly deployed git revision $GITHUB_SHA"
          exit 1
