name: Standard Red Blue Themes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/standard-three-themes.yml"
      - "scripts/apply-standard-themes.py"
      - "src/standard-theme-runtime.js"
      - "src/standard-theme-variants.css"
      - "public/ennstal-connect-wordmark-red.svg"
      - "public/ennstal-connect-wordmark-blue.svg"

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply three-theme source migration
        run: python3 scripts/apply-standard-themes.py
      - name: Install dependencies
        run: npm ci
      - name: Verify source and production build
        run: npm run test:ci
      - name: Publish verified theme build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/main.jsx src/standard-theme-runtime.js src/standard-theme-variants.css public/ennstal-connect-wordmark-red.svg public/ennstal-connect-wordmark-blue.svg dist
          if git diff --cached --quiet; then
            echo "Theme system already current"
            exit 0
          fi
          git commit -m "Keep standard layout and add red blue themes"
          git push origin HEAD:main
